<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converter — GG.Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/navigation.css">
<link rel="stylesheet" href="css/measurement-converter.css">
</head>
<body>
<div id="app">
  <div id="nav-placeholder"></div>

  <div id="page-container">
    <div class="page-header">
      <div class="accent-line" style="background:var(--accent)"></div>
      <h1>Converter</h1>
      <p>Temperature, distance, volume & weight conversions.</p>
    </div>

    <!-- Mode tabs -->
    <div class="converter-tabs">
      <button class="conv-tab active" data-tab="temp"     onclick="setConverterTab('temp')">Temperature</button>
      <button class="conv-tab"        data-tab="distance" onclick="setConverterTab('distance')">Distance</button>
      <button class="conv-tab"        data-tab="volume"   onclick="setConverterTab('volume')">Volume & Weight</button>
    </div>

    <!-- Temperature -->
    <div id="conv-section-temp">
      <div class="temp-wrap">
        <div class="temp-card">
          <div class="temp-label">°F</div>
          <input type="text" id="temp-f" class="temp-input" placeholder="32" inputmode="decimal" oninput="tempFromF()" onclick="this.select()">
        </div>
        <div class="temp-card">
          <div class="temp-label">°C</div>
          <input type="text" id="temp-c" class="temp-input" placeholder="0" inputmode="decimal" oninput="tempFromC()" onclick="this.select()">
        </div>
      </div>
    </div>

    <!-- Distance -->
    <div id="conv-section-distance" style="display:none">
      <div class="conv-wrap">
        <button class="unit-btn" onclick="openDistPicker('dist-from')">
          <span id="dist-from-label">cm</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <input type="text" id="dist-input" class="conv-input" placeholder="0" inputmode="decimal" oninput="updateDistResult()" onclick="this.select()">
        <button class="swap-btn" onclick="swapDistUnits()" title="Swap">⇅</button>
        <button class="unit-btn" onclick="openDistPicker('dist-to')">
          <span id="dist-to-label">in</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="conv-result" id="dist-result"></div>
      </div>
    </div>

    <!-- Volume & Weight -->
    <div id="conv-section-volume" style="display:none">
      <div class="conv-wrap">
        <button class="unit-btn" id="from-btn" onclick="openPicker('from')">
          <span id="from-label">tbsp</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <input type="text" id="conv-input" class="conv-input" placeholder="0" inputmode="decimal" oninput="updateResult()" onclick="this.select()">
        <button class="swap-btn" onclick="swapUnits()" title="Swap">⇅</button>
        <button class="unit-btn" id="to-btn" onclick="openPicker('to')">
          <span id="to-label">tsp</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="ingredient-btn" id="ingredient-btn" onclick="openIngredientPicker()" style="display:none">
          <span id="ingredient-label">Select ingredient</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="conv-result" id="conv-result"></div>
      </div>
    </div>

  </div>
</div>

<!-- Unit picker overlay -->
<div class="picker-overlay" id="picker-overlay" onclick="closePicker()">
  <div class="picker-sheet" onclick="event.stopPropagation()">
    <div class="picker-title" id="picker-title">Select unit</div>
    <div class="picker-grid" id="picker-grid"></div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/measurement-converter.js"></script>
<script>initNav();</script>
</body>
</html>
