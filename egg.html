<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egg — GG.Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/navigation.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/egg.css">
</head>
<body>
<div id="app">
  <div id="nav-placeholder"></div>

  <div id="page-container">
    <div class="page-header">
      <div class="accent-line"></div>
      <h1>Egg</h1>
      <p>Pick how you want your egg — we'll tell you how long to cook it.</p>
    </div>

    <div class="egg-assumption">
      Water must be at a <strong>full rolling boil</strong> before eggs are added. Timer starts the moment eggs hit the water.
    </div>

    <div class="egg-grid">

      <div class="egg-btn egg-btn-1">
        <div class="egg-btn-overlay">
          <span class="egg-btn-label">Soft-Boiled</span>
          <span class="egg-btn-time">6 min</span>
        </div>
      </div>

      <div class="egg-btn egg-btn-2">
        <div class="egg-btn-overlay">
          <span class="egg-btn-label">Jammy</span>
          <span class="egg-btn-time">8 min</span>
        </div>
      </div>

      <div class="egg-btn egg-btn-3">
        <div class="egg-btn-overlay">
          <span class="egg-btn-label">Medium</span>
          <span class="egg-btn-time">10 min</span>
        </div>
      </div>

      <div class="egg-btn egg-btn-4">
        <div class="egg-btn-overlay">
          <span class="egg-btn-label">Hard-Boiled</span>
          <span class="egg-btn-time">12 min</span>
        </div>
      </div>

      <div class="egg-btn egg-btn-5">
        <div class="egg-btn-overlay">
          <span class="egg-btn-label">Extra Firm</span>
          <span class="egg-btn-time">14 min</span>
        </div>
      </div>

    </div>

  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/main.js"></script>
</body>
</html>
